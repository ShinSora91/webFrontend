<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let u = [
        [10, 20, 30],
        [70, 80, 807],
        [11, 12, 34],
        [56, 78, 90],
      ];
      //1) {"a_1":60, "a_2":957 } //가로
      //2) {"a_1":10+70+12+56, "a_2":20+80+12+78} //세로

      let objWidth = { a_1: 0, a_2: 0, a_3: 0, a_4: 0 }; //가로
      let objLength = { a_1: 0, a_2: 0, a_3: 0 }; //세로

      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 3; j++) {
          objLength["a_" + (j + 1)] += u[i][j];
          objWidth["a_" + (i + 1)] += u[j][i];
        }
      }

      console.log(objLength);
      console.log(objWidth);
      // console.log(objLength);
    </script>
  </body>
</html>
